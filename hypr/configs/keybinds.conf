$mainMod = SUPER

# ============================== #
# ---------- Keybinds ---------- #
# ============================== #

# Terminal 
bind = CTRL+ALT, T, exec, foot

# Fermer la fenêtre active 
bind = ALT, F4, killactive

# Verrouiller l'écran 
bind = SUPER, L, exec, hyprlock

# Gestionnaire de taches 
bind = CTRL SHIFT, Escape, exec, footclient btop

# Ouvrir explorateur de fichier
bind = $mainMod, e, exec , foot --app-id yazi-float yazi

# Screenshot
bind = $mainMod SHIFT, s, exec, grim -g "$(slurp)" /home/piqah/Data/Pictures/screenshots/$(date +'%Y-%m-%d_%H-%M-%S_selection.png')
# Naviguer / swapper
#bind = $mainMod, f, fullscreen
#bind = $mainMod+SHIFT, f, pseudo
bind = $mainMod, SPACE, togglefloating, active

bind = $mainMod, Tab, hyprexpo:expo, toggle
bind = ALT, Tab, swapnext
bind = ALT, Escape, exec, ~/.config/hypr/scripts/next.sh
bind = ALT SHIFT, Escape, exec, ~/.config/hypr/scripts/prev.sh
bind = $mainMod, f, fullscreen
bind = $mainMod+SHIFT, f, pseudo
bind = $mainMod, SPACE, togglefloating, active
bind = $mainMod, j, movefocus, r
bind = $mainMod, k, movefocus, l
bind = $mainMod, t, exec, ~/.config/hypr/toggle_theme.sh

# Wofi et utilitaires personnalisés
bind = $mainMod, d, exec, wofi-blu
bind = $mainMod, s, exec, wofi-wifi
bind = $mainMod, x, exec, departure

# Visionneuse d’images
bind = $mainMod, v, exec, sxiv -t -b /home/piqah/Pictures/*

# Contrôles musicaux avec mocp
bind = $mainMod, left, exec, mocp -M .config/moc -r
bind = $mainMod, right, exec, mocp -M .config/moc -f
bind = $mainMod, up, exec, mocp -M .config/moc -G

#bind = ALT, p, exec, clipman pick -t wofi
bind = $mainMod, r, exec, wofi --show drun --allow-empty

# Groupes & fenêtres 
bind = $mainMod+SHIFT, g, togglegroup
bind = $mainMod+SHIFT, J, togglesplit

# Workspaces 
# Creation workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

bind = $mainMod SHIFT, right, movetoworkspace, m+1
bind = $mainMod SHIFT, left, movetoworkspace, m-1

bind = SUPER, a, togglespecialworkspace
bind = SUPER+SHIFT, a, movetoworkspace, special

#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1

# Déplacer / redimensionner la fenêtre à la souris
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# Multimedia 
binde = , XF86AudioLowerVolume, exec, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; VOL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}"); notify-send -h string:x-dunst-stack-tag:audio -h int:value:"$VOL" "Volume: ${VOL}%"'
binde = , XF86AudioRaiseVolume, exec, sh -c 'wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+; VOL=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int(\$2 * 100)}"); notify-send -h string:x-dunst-stack-tag:audio -h int:value:"$VOL" "Volume: ${VOL}%"'
binde = , XF86MonBrightnessUp, exec, brightnessctl set $(( ($(brightnessctl get) * 100 / $(brightnessctl max) / 10 + 1) * 10 ))% && notify-send -h string:x-dunst-stack-tag:light -h int:value:"$(brightnessctl i | grep -oP '\(\K[^%]+')" "Luminosité : $(brightnessctl i | grep -oP '\(\K[^%]+')%"
binde = , XF86MonBrightnessDown, exec, brightnessctl set $(( ($(brightnessctl get) * 100 / $(brightnessctl max) / 10 - 1) * 10 ))% && notify-send -h string:x-dunst-stack-tag:light -h int:value:"$(brightnessctl i | grep -oP '\(\K[^%]+')" "Luminosité : $(brightnessctl i | grep -oP '\(\K[^%]+')%"
bind = , XF86AudioMute, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; if wpctl get-volume @DEFAULT_AUDIO_SINK@ | grep -q "MUTED"; then notify-send -h string:x-dunst-stack-tag:audio "🔇 Volume : Muted"; else notify-send -h string:x-dunst-stack-tag:audio "🔉 Volume : Activated"; fi'
bind = , XF86AudioMicMute, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle; if wpctl get-volume @DEFAULT_AUDIO_SOURCE@ | grep -q "MUTED"; then notify-send -h string:x-dunst-stack-tag:mic "  Mic : Cut"; else notify-send -h string:x-dunst-stack-tag:mic "  Mic : Activated"; fi'
#bind = , Home, exec, playerctl play-pause
bind = , Home, exec, ~/.config/hypr/scripts/start_or_toggle_spotube.sh
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
