source = ~/.config/hypr/configs/keybinds.conf
source = ~/.config/hypr/configs/exec.conf
source = ~/.config/hypr/configs/window_rules.conf
source = ~/.config/hypr/configs/monitors.conf
source = ~/.config/hypr/configs/theme.conf

env = EDITOR, nvim
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,ComixCursors-White
env = GTK_THEME,Adwaita-dark
env = ICON_THEME,Adwaita
env = GTK_APPLICATION_PREFER_DARK_THEME,1
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

input {
    kb_layout = fr 
    kb_variant = latin9
    kb_variant = latin9
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0
}
general {
    gaps_in = 0 
    gaps_out = 0
    border_size = 1
    col.active_border = rgba($color_accent1) rgba($color_accent2) 45deg
    col.inactive_border = rgba($color_accent2)
    resize_on_border = false
    allow_tearing = true
    layout = dwindle
}
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    always_follow_on_dnd = true
}
decoration {
    rounding = 0
    active_opacity = 0.93
    inactive_opacity = 0.7
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba($color_shadow)
    }
}
animations {
    enabled = 1
    bezier=overshot,0.13,0.99,0.29,1.1
    animation=windows,1,4,overshot,slide
    animation=border,1,10,default
    animation=fade,1,3,default
    animation=workspaces,1,6,overshot,slidevert
}
dwindle {
    preserve_split = yes
}
master {
}
gestures {
}
device:epic-mouse-v1 {
}
plugin {
    overview {
        onBottom = true
        exitOnSwitch = false
        hideBackgroundLayers = false
        hideOverlayLayers = false
        drawActiveWorkspace = true
        switchOnDrop = true
        panelHeight = 150
        workspaceMargin = 10
        showNewWorkspace = false
        showEmptyWorkspace = true
        autoScroll = true
        affectStrut = false

        panelColor = rgba(15, 15, 15, 0.9)
        workspaceActiveBorder = rgba($color_accent1)
        workspaceInactiveBorder = rgba($color_accent2)
    } 
}
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1, persistent:true
workspace = 3, monitor:eDP-1, persistent:true
workspace = 4, monitor:eDP-1, persistent:true
workspace = 5, monitor:eDP-1, persistent:true
workspace = 6, monitor:HDMI-A-1, persistent:true
