format = """
[](#2e3440)\
[ ](bg:#2e3440 fg:#d7d9ce)$username\
[](fg:#2e3440 bg:#119da4)\
[  $directory](bg:#119da4 fg:#040404)\
[](fg:#119da4 bg:#0c7489)\
$git_branch\
$git_status\
$python\
[](fg:#0c7489 bg:#2e3440)\
$cmd_duration\
$status\
$character
"""
[username]
show_always = true
style_user = "fg:#d7d9ce bg:#2e3440"

[directory]
style = "fg:#040404 bg:#119da4"
truncate_to_repo = true
truncation_length = 3
read_only = " "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style)"
style = "fg:#88c0d0 bg:#0c7489"

[git_status]
format = "[$all_status]($style)"
style = "fg:#d08770 bg:#0c7489"

[python]
symbol = " 🐍"
format = "[$symbol$virtualenv ]($style)"
style = "fg:#88c0d0 bg:#0c7489"
detect_extensions = []
detect_files = []

[cmd_duration]
min_time = 500
format = "[took $duration]($style)"
style = "yellow"

[status]
disabled = false
format = "[$status]($style)"
style = "bold red"

[character]
success_symbol = "[❯](bold #a3be8c)"
error_symbol = "[❯](bold #bf616a)"
