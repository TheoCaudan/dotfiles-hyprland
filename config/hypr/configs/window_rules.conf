# MPV
windowrule = opacity 1.0, match:class mpv
windowrule = match:float true, match:class mpv
windowrule = size 1299 701, match:class mpv
windowrule = center = 1 , match:class mpv

# Waybar
windowrule = match:float true, match:class waybar
windowrule = tile = 1, match:class waybar
windowrule { noborder = on, match:class waybar }
windowrule = rounding 0, match:class waybar
windowrule { noshadow = on, match:class waybar }
windowrule { stayfocused = on, match:class waybar }
windowrule { opaque = 1, match:class waybar }
windowrule { nofocus = 1, match:class waybar }

# Wofi
windowrule = rounding 0, match:class wofi
windowrule { noshadow = 1, match:class wofi }
windowrule = center = 1, match:class wofi
windowrule { nomaxsize = 1, match:class wofi }
windowrule = match:float true, match:class wofi

# Departure
windowrule { noshadow = 1, match:class departure }

# Dota 2
windowrule = match:float true, match:title (Dota 2)
windowrule = fullscreen 1, match:title (Dota 2)
windowrule { noborder = on, match:title (Dota 2) }
windowrule = workspace 4 silent, match:title (Dota 2)

# Ratchet & Clank
windowrule = match:float true, match:title (Ratchet & Clank: Rift Apart)
windowrule = fullscreen 1, match:title (Ratchet & Clank: Rift Apart)
windowrule { noborder = on, match:title (Ratchet & Clank: Rift Apart) }
windowrule = workspace 4 silent, match:title (Ratchet & Clank: Rift Apart)

# Thunar
windowrule = match:float true, match:class Thunar
windowrule = size 1000 650, match:class Thunar
windowrule = center = 1, match:class Thunar
