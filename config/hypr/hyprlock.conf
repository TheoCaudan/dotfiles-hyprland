source = ~/.config/hypr/configs/theme.conf

background {
    monitor =
    path = /home/piqah/Data/Pictures/wallpapers/dark_wallpaper_tokyo.jpg
    blur_passes = 1
    blur_size = 7
    vibrancy = 0.1
    vibrancy_darkness = 0.5
}

layer {
    monitor =
    color = rgba($color_bg:a0) 
    # color = rgba(040404a0) 
}

label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba($color_fg:ff)
    font_family = JetBrains Mono Nerd Font
    font_size = 80
    font-weight = bold
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B'
    color = rgba($color_accent1:ff)
    font_family = JetBrains Mono Nerd Font
    font_size = 24
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 50
    outline_thickness = 4
    hide_input = true
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    position = 0, -180
    halign = center
    valign = center
    
    inner_color = rgba($color_bg:cc)         
    outer_color = rgba($color_accent1:ff)    
    fail_color = rgba(bf616a99)              
    text_color = rgba($color_fg:ff)
    
    placeholder_text = Password...
    
    font_family = JetBrains Mono Nerd Font
    font_size = 16
    
    hide_input = false
    check_color = rgba($color_accent2:ff)
    fail_text = Wrong password!
}
